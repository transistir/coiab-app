name: Deploy guide

on:
  push:
    branches: [develop]
    paths:
      - 'docs/guia/**'
      - '.rnstorybook/capture-manifest.tsv'
      - '.github/workflows/deploy-guide.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/guia/package-lock.json
      - run: npm ci --prefix docs/guia
      - run: npm run check --prefix docs/guia
      - run: npm run build --prefix docs/guia
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/guia/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
