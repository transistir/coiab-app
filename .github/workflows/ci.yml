name: CI

on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    # By default, a workflow only runs when a pull_request's activity type is
    # opened, synchronize, or reopened. Adding ready_for_review here ensures
    # that CI runs when a PR is marked as not a draft, since we skip CI when a
    # PR is draft
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  all:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install deps
        run: npm ci
      - name: Check message catalog
        run: npm run check:message-catalog
      - name: Check formatting
        run: npm run lint:prettier
      - name: Run ESLint
        run: npm run lint:eslint
      - name: Run shell script fixtures
        run: npm run test:scripts

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install deps
        run: npm ci
      - name: Build translations
        run: npm run build:translations
      - name: Build Intl polyfills
        run: npm run build:intl-polyfills
      - name: Generate Storybook index
        run: EXPO_PUBLIC_STORYBOOK_ENABLED=true npm run storybook-generate
      - name: Check types
        run: npm run lint:types
      - name: Run unit tests
        run: npm run test:jest -- --testPathIgnorePatterns='/tests/e2e/' --testPathIgnorePatterns='seededDeepStack' --testPathIgnorePatterns='scripts/sync/'
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          COMAPEO_METRICS_URL: ${{ vars.COMAPEO_METRICS_URL }}
          COMAPEO_METRICS_API_KEY: ${{ secrets.COMAPEO_METRICS_API_KEY }}
      # These mount a real @comapeo/core client plus the navigator and hold
      # ~1-1.5GB each. Sharing the parallel worker pool, two of them in one
      # worker reached the 4GB heap ceiling and were killed mid-run; isolated in
      # a fresh process with --runInBand they pass. Keep them in the gate.
      - name: Run seeded navigator integration suites
        run: |
          # Same files the pool skips above (`--testPathIgnorePatterns='seededDeepStack'`),
          # narrowed to what jest collects as a suite so non-test helpers such as
          # seededDeepStack.helpers.tsx are not passed to jest ("No tests found" exits 1).
          tests=$(git ls-files \
            | grep seededDeepStack \
            | grep -E '(__tests__/.*\.[cm]?[jt]sx?$|\.(spec|test)\.([cm]?[jt]sx?|mjs)$)' \
            || true)
          if [ -z "$tests" ]; then
            echo "::error::no seededDeepStack test suites found"
            exit 1
          fi
          for f in $tests; do
            echo "::group::$f"
            npx dotenv -- jest "$f" --runInBand
            echo "::endgroup::"
          done
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          COMAPEO_METRICS_URL: ${{ vars.COMAPEO_METRICS_URL }}
          COMAPEO_METRICS_API_KEY: ${{ secrets.COMAPEO_METRICS_API_KEY }}

  sync-contract:
    # Only sync PRs touch `.sync/customizations.json`; ordinary PRs skip this
    # job rather than failing it.
    if: startsWith(github.head_ref, 'sync/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The checker needs history to resolve the merge-base.
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Check customization contract
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          PARENT=$(git merge-base "origin/$BASE_REF" HEAD)
          node scripts/sync/check-customizations.mjs --parent "$PARENT" --head HEAD
      - name: Test the customization checker
        run: node --test scripts/sync/check-customizations.test.mjs
