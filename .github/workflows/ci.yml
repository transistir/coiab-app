name: CI

on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    # By default, a workflow only runs when a pull_request's activity type is
    # opened, synchronize, or reopened. Adding ready_for_review here ensures
    # that CI runs when a PR is marked as not a draft, since we skip CI when a
    # PR is draft
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  all:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install deps
        run: npm ci
      - name: Check message catalog
        run: npm run check:message-catalog
      - name: Check formatting
        run: npm run lint:prettier
      - name: Run ESLint
        run: npm run lint:eslint
      - name: Run shell script fixtures
        run: npm run test:scripts

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install deps
        run: npm ci
      - name: Build translations
        run: npm run build:translations
      - name: Build Intl polyfills
        run: npm run build:intl-polyfills
      - name: Generate Storybook index
        run: EXPO_PUBLIC_STORYBOOK_ENABLED=true npm run storybook-generate
      - name: Check types
        run: npm run lint:types
      # THROWAWAY probe matrix: first leave from the Menu tab, one step per file
      # so an OOM in one cannot hide the others.
      - name: Probe m1 (control, test 2 verbatim)
        continue-on-error: true
        run: npm run test:jest -- --runInBand --logHeapUsage --testPathPattern '/__probe__/m1-control\.test\.tsx$'
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          COMAPEO_METRICS_URL: ${{ vars.COMAPEO_METRICS_URL }}
          COMAPEO_METRICS_API_KEY: ${{ secrets.COMAPEO_METRICS_API_KEY }}
      - name: Probe m2 (Menu without the shift animation)
        continue-on-error: true
        run: npm run test:jest -- --runInBand --logHeapUsage --testPathPattern '/__probe__/m2-no-animation\.test\.tsx$'
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          COMAPEO_METRICS_URL: ${{ vars.COMAPEO_METRICS_URL }}
          COMAPEO_METRICS_API_KEY: ${{ secrets.COMAPEO_METRICS_API_KEY }}
      - name: Probe m3 (leave Menu for Notificacoes)
        continue-on-error: true
        run: npm run test:jest -- --runInBand --logHeapUsage --testPathPattern '/__probe__/m3-other-tab\.test\.tsx$'
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          COMAPEO_METRICS_URL: ${{ vars.COMAPEO_METRICS_URL }}
          COMAPEO_METRICS_API_KEY: ${{ secrets.COMAPEO_METRICS_API_KEY }}
