name: CI

on:
  push:
    branches: [develop, "release/**"]
  pull_request:
    # By default, a workflow only runs when a pull_request's activity type is
    # opened, synchronize, or reopened. Adding ready_for_review here ensures
    # that CI runs when a PR is marked as not a draft, since we skip CI when a
    # PR is draft
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  all:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install deps
        run: npm ci
      - name: Check message catalog
        run: npm run check:message-catalog
      - name: Check formatting
        run: npm run lint:prettier
      - name: Run ESLint
        run: npm run lint:eslint
      - name: Run shell script fixtures
        run: npm run test:scripts

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
      - name: Install deps
        run: npm ci
      - name: Build translations
        run: npm run build:translations
      - name: Build Intl polyfills
        run: npm run build:intl-polyfills
      - name: Generate Storybook index
        run: EXPO_PUBLIC_STORYBOOK_ENABLED=true npm run storybook-generate
      - name: Check types
        run: npm run lint:types
      - name: Run unit tests
        run: npm run test:jest
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          # The metrics vars are deliberately NOT set here. No unit test asserts
          # them, and their only effect is to let the metrics pipeline attempt a
          # real POST during the run; against the placeholder URL that request
          # never settles, and the seeded deep stack suites then exhaust the
          # worker heap (reproduced locally: same suite passes without the vars,
          # dies at 1.2GB with them).
