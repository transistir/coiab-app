name: Storybook Flow Capture

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The APK build dominates the run (~38 min). It lives in its own job so a
    # capture flake is retried with "Re-run failed jobs", which reuses this
    # job's APK instead of paying for the build again.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Free up space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Cache dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
            ~/.gradle/daemon/
            node_modules
          key: storybook-dependencies-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            storybook-dependencies-cache-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Storybook index
        run: EXPO_PUBLIC_STORYBOOK_ENABLED=true npm run storybook-generate

      # A standalone APK with the bundle embedded, built the same way as the
      # BrowserStack e2e job (eas build --local, .test profile). Deliberately
      # not a Metro dev-server build: babysitting Metro alongside an emulator
      # in one job is exactly the fragile pattern that caused repeated
      # capture failures in local/manual testing, and it's unnecessary here
      # since the bundle only needs to be built once, not served live.
      - name: Build standalone Storybook APK
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          EXPO_PUBLIC_STORYBOOK_ENABLED: 'true'
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          COMAPEO_METRICS_URL: ${{ vars.COMAPEO_METRICS_URL }}
          COMAPEO_METRICS_API_KEY: ${{ secrets.COMAPEO_METRICS_API_KEY }}
        run: |
          npm run extract-messages
          eas build --platform android --profile storybook --local --non-interactive
          mkdir -p apk
          mv "$(ls -t build-*.apk | head -n 1)" apk/storybook.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: storybook-apk-${{ github.run_number }}
          path: apk/storybook.apk
          retention-days: 3
          if-no-files-found: error

  capture:
    needs: build
    runs-on: ubuntu-latest
    # The capture manifest drives wall-clock cost directly (one emulator
    # interaction per row); a full successful capture measured ~14 min.
    timeout-minutes: 45
    env:
      STORYBOOK_PACKAGE_ID: org.coiab.rc
      APK_PATH: apk/storybook.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The capture scripts need node_modules (@storybook/react-native/node).
      # Restore only, so the two jobs never race to save the same key; the
      # path list must match the build job's exactly, or the cache misses.
      - name: Restore dependencies
        id: cache-dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
            ~/.gradle/daemon/
            node_modules
          key: storybook-dependencies-cache-${{ hashFiles('package-lock.json') }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: storybook-apk-${{ github.run_number }}
          path: apk

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Always a cold boot on a fresh AVD, by design. AVD cache/snapshot steps
      # were removed on 2026-09-09: the snapshot save hung the runner until
      # the job timeout (run 34400273000) and earlier runs failed to load the
      # cached snapshot; a cold boot measures ~45 s. "Failed to load
      # snapshot", "adb daemon on port 5037", "stop: Not implemented" and
      # netsim lines in this step's log are cold-boot/teardown noise; the real
      # signal is the "capture failed at position N" line.
      - name: Capture Storybook flow screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The action runs each line with `sh -c`: without pipefail, `tee`
          # would hide the capture script's exit code.
          script: |
            adb uninstall "$STORYBOOK_PACKAGE_ID" || true
            adb install "$APK_PATH"
            bash -c 'set -o pipefail; scripts/storybook-capture-all.sh storybook-captures 2>&1 | tee "$RUNNER_TEMP/capture.log"'
            node scripts/storybook-report.mjs storybook-captures

      # ELOCKED is a known runtime flake, not stale state: run 35802920896
      # hit it in the first process after a fresh AVD, uninstall and install,
      # one second after a story deep link paused and resumed the activity.
      - name: Classify failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/capture.log"
          {
            echo '## Storybook capture failure'
            if [ ! -s "$log" ]; then
              echo '**Infra** — emulator/install failed before capture began; see the step log.'
            elif grep -q 'device offline' "$log"; then
              echo '**Infra** — emulator went offline mid-run. Use "Re-run failed jobs" (reuses the APK).'
            elif grep -rqs 'ELOCKED' storybook-captures --include='*.failure-logcat.txt'; then
              echo '**Known runtime flake** — the core backend died on `ELOCKED: File is locked`. Use "Re-run failed jobs" (reuses the APK).'
            else
              echo '**App/story** — inspect the failure diagnostics in the captures artifact.'
            fi
            echo; echo '```'
            grep -E 'capture failed at position|timed out waiting|device offline' "$log" | tail -n 5 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-captures-${{ github.run_number }}
          path: storybook-captures/
          retention-days: 30
          if-no-files-found: warn
